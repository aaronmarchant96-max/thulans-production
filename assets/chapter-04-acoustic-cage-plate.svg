  <text x="420" y="618" text-anchor="end" class="small">DO NOT REMOVE UNDER LOAD</text>

  <text x="470" y="700" text-anchor="middle" class="fig">FIG. 4a</text>
  <text x="470" y="730" text-anchor="middle" class="label">ACOUSTIC CAGE ASSEMBLY</text>
  <text x="470" y="754" text-anchor="middle" class="small">FAIRGUNJIS CAISSON SEVEN / INTACT SERVICE STATE</text>
  <line x1="80" y1="730" x2="250" y2="730" class="ink"/>
  <line x1="80" y1="720" x2="80" y2="740" class="ink"/>
  <line x1="250" y1="720" x2="250" y2="740" class="ink"/>
  <text x="165" y="716" text-anchor="middle" class="small">200 mm REFERENCE</text>
