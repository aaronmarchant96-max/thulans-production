name: CARDO claim integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run repository tests
        run: python -m unittest discover -s spec -v
      - name: Audit canonical claim records
        run: python tools/audit_claim_records.py
